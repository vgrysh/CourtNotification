<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Court Availability</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 28px;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 14px;
      padding: 24px;
      max-width: 680px;
      margin: 0 auto 20px;
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #7c85a2;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #7c85a2;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus { border-color: #4f6ef7; }

    /* Club combobox */
    .combo-wrap { position: relative; }

    .combo-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 8px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
    }

    .combo-dropdown.open { display: block; }

    .combo-item {
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .combo-item:hover, .combo-item.active { background: #2d3148; }
    .combo-item-name { font-size: 0.9rem; color: #e2e8f0; }
    .combo-item-loc  { font-size: 0.75rem; color: #7c85a2; margin-top: 1px; }
    .combo-loading   { padding: 12px; color: #7c85a2; font-size: 0.85rem; text-align: center; }

    .row-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    #btnCheck { background: #4f6ef7; color: #fff; }
    #btnCheck:hover:not(:disabled) { background: #3a58e0; }

    #btnPoll { background: #1e2d3d; color: #4fc3f7; border: 1px solid #4fc3f7; }
    #btnPoll:hover:not(:disabled) { background: #263a4d; }

    #status {
      text-align: center;
      font-size: 0.82rem;
      color: #7c85a2;
      margin-top: 14px;
      min-height: 18px;
    }

    #status.error { color: #f87171; }
    #status.ok    { color: #4ade80; }

    #results { max-width: 680px; margin: 0 auto 20px; }

    .slot-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-left: 3px solid #4f6ef7;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .slot-info { flex: 1; }
    .slot-court { font-weight: 600; font-size: 0.95rem; color: #fff; }
    .slot-time  { font-size: 0.82rem; color: #7c85a2; margin-top: 2px; }

    .btn-book {
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex: none;
      text-decoration: none;
      display: inline-block;
    }

    .btn-book:hover { background: #3a58e0; }

    .empty {
      text-align: center;
      color: #4a5068;
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .badge {
      display: inline-block;
      background: #1e2d3d;
      color: #4fc3f7;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: middle;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #7c85a2;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    /* Telegram */
    .tg-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .tg-row input { flex: 1; }

    .btn-tg {
      padding: 10px 16px;
      background: #229ED9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex: none;
    }

    .btn-tg:hover { background: #1a8bbf; }
    .btn-tg:disabled { opacity: 0.45; cursor: not-allowed; }

    .tg-status {
      font-size: 0.8rem;
      margin-top: 6px;
      min-height: 16px;
    }

    .tg-status.linked   { color: #4ade80; }
    .tg-status.unlinked { color: #f87171; }
    .tg-status.info     { color: #7c85a2; }

    .hint {
      font-size: 0.78rem;
      color: #4a5068;
      margin-top: 6px;
    }

    .hint a { color: #229ED9; text-decoration: none; }

    /* Logs */
    #logBox {
      background: #0a0c14;
      border: 1px solid #2d3148;
      border-radius: 8px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.78rem;
      color: #7c85a2;
      padding: 12px;
      height: 200px;
      overflow-y: auto;
      line-height: 1.6;
    }

    #logBox .log-line { white-space: pre-wrap; }
    #logBox .log-line.found { color: #4ade80; }
    #logBox .log-line.error { color: #f87171; }
    #logBox .log-line.tg    { color: #229ED9; }

    .log-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .btn-clear {
      background: none;
      border: 1px solid #2d3148;
      color: #7c85a2;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      flex: none;
    }

    .btn-clear:hover { border-color: #4f6ef7; color: #e2e8f0; }

    .header-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      max-width: 680px;
      margin: 0 auto 28px;
    }

    .header-wrap h1 { margin-bottom: 0; }

    .btn-stop-server {
      position: absolute;
      right: 0;
      background: none;
      border: 1px solid #4a3030;
      color: #f87171;
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      flex: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-stop-server:hover { background: #3d1e1e; border-color: #f87171; }

    /* Active polls list */
    #pollsSection { max-width: 680px; margin: 0 auto 20px; }

    .polls-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .poll-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-left: 3px solid #4fc3f7;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.2s ease;
    }

    .poll-info { flex: 1; min-width: 0; }

    .poll-club {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poll-meta {
      font-size: 0.78rem;
      color: #7c85a2;
      margin-top: 2px;
    }

    .poll-status {
      font-size: 0.78rem;
      margin-top: 4px;
      color: #4a5068;
    }

    .poll-status.found { color: #4ade80; }
    .poll-status.error { color: #f87171; }

    .btn-stop-poll {
      background: none;
      border: 1px solid #4a3030;
      color: #f87171;
      border-radius: 7px;
      padding: 5px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      flex: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-stop-poll:hover { background: #3d1e1e; border-color: #f87171; }
  </style>
</head>
<body>
  <div class="header-wrap">
    <h1>🎾 Court Availability</h1>
    <button class="btn-stop-server" onclick="stopServer()">⏹ Stop server</button>
  </div>

  <!-- Search -->
  <div class="card">
    <div class="grid">
      <div class="full">
        <label>Club</label>
        <div class="combo-wrap">
          <input id="clubInput" autocomplete="off" placeholder="Search club…" />
          <div id="clubDropdown" class="combo-dropdown">
            <div class="combo-loading">Loading clubs…</div>
          </div>
        </div>
      </div>
      <div>
        <label>Date</label>
        <input id="date" type="date" />
      </div>
      <div>
        <label>Poll interval</label>
        <select id="interval">
          <option value="1">Every 1 min</option>
          <option value="2">Every 2 min</option>
          <option value="5" selected>Every 5 min</option>
          <option value="10">Every 10 min</option>
          <option value="30">Every 30 min</option>
        </select>
      </div>
      <div>
        <label>Court filter (optional)</label>
        <input id="court" placeholder="e.g. Kort 4" />
      </div>
      <div>
        <label>Duration</label>
        <select id="duration">
          <option value="">Any</option>
          <option value="60">1h</option>
          <option value="90">1.5h</option>
          <option value="120">2h</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;grid-column:1/-1;">
        <div style="flex:1"><label>From</label><input id="from" type="time" step="3600" /></div>
        <div style="flex:1"><label>To</label><input id="to" type="time" step="3600" /></div>
      </div>
    </div>
    <div class="row-actions">
      <button id="btnCheck" onclick="checkOnce()">Check now</button>
      <button id="btnPoll" onclick="addPoll()">Add poll</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- Results -->
  <div id="results"></div>

  <!-- Active polls -->
  <div id="pollsSection" style="display:none">
    <div class="polls-header">
      <div class="section-title" style="margin-bottom:0">Active polls</div>
      <span class="badge" id="pollCount">0</span>
      <button class="btn-clear" onclick="stopAllPolls()" style="margin-left:auto">Stop all</button>
    </div>
    <div id="pollsList"></div>
  </div>

  <!-- Telegram -->
  <div class="card">
    <div class="card-title">Telegram notifications</div>
    <div>
      <label>Bot token</label>
      <div class="tg-row">
        <input id="tgToken" type="password" placeholder="1234567890:AAH…" autocomplete="off" />
        <button class="btn-tg" onclick="saveToken()">Save</button>
      </div>
      <div class="hint">
        Get a token from <a href="https://t.me/BotFather" target="_blank">@BotFather</a>. Stored in memory only — re-enter after restart.
      </div>
    </div>
    <div style="margin-top:16px;">
      <label>Your username</label>
      <div class="tg-row">
        <input id="tgUsername" placeholder="@yourusername" autocomplete="off" />
        <button class="btn-tg" id="btnLink" onclick="linkTelegram()">Link</button>
      </div>
      <div class="hint">Send <b>/start</b> to your bot first, then click Link.</div>
      <div id="tgStatus" class="tg-status info"></div>
    </div>
  </div>

  <!-- Logs -->
  <div class="card">
    <div class="log-toolbar">
      <div class="card-title" style="margin-bottom:0">Activity log</div>
      <button class="btn-clear" onclick="clearLogs()">Clear</button>
    </div>
    <div id="logBox"><span style="color:#4a5068">Waiting for activity…</span></div>
  </div>

  <script>
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    document.getElementById('from').value = '08:00';
    document.getElementById('to').value = '12:00';

    ['from', 'to'].forEach(id => {
      document.getElementById(id).addEventListener('input', function () {
        if (this.value) this.value = this.value.slice(0, 3) + '00';
      });
    });

    // ── Club combobox ────────────────────────────────────────────────
    let allClubs = [];
    let selectedSlug = '';

    const clubInput    = document.getElementById('clubInput');
    const clubDropdown = document.getElementById('clubDropdown');

    async function loadClubs() {
      try {
        const res = await fetch('/api/clubs');
        allClubs = await res.json();
        renderDropdown(allClubs);
      } catch (e) {
        clubDropdown.innerHTML = `<div class="combo-loading">Failed to load clubs</div>`;
      }
    }

    function renderDropdown(clubs) {
      if (clubs.length === 0) {
        clubDropdown.innerHTML = `<div class="combo-loading">No clubs found</div>`;
        return;
      }
      clubDropdown.innerHTML = clubs.map(c => `
        <div class="combo-item" data-slug="${c.slug}" onclick="selectClub('${c.slug}', '${c.name.replace(/'/g,"\\'")}')">
          <div class="combo-item-name">${c.name}</div>
          <div class="combo-item-loc">${c.location}</div>
        </div>
      `).join('');
    }

    function selectClub(slug, name) {
      selectedSlug = slug;
      clubInput.value = name;
      clubDropdown.classList.remove('open');
    }

    clubInput.addEventListener('focus', () => clubDropdown.classList.add('open'));

    clubInput.addEventListener('input', () => {
      selectedSlug = '';
      const q = clubInput.value.toLowerCase();
      renderDropdown(allClubs.filter(c =>
        c.name.toLowerCase().includes(q) || c.slug.toLowerCase().includes(q)
      ));
      clubDropdown.classList.add('open');
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.combo-wrap')) clubDropdown.classList.remove('open');
    });

    loadClubs();

    // ── Telegram ─────────────────────────────────────────────────────
    let tgLinked = false;

    async function saveToken() {
      const token = document.getElementById('tgToken').value.trim();
      if (!token) return;
      await fetch('/api/telegram/configure?token=' + encodeURIComponent(token), { method: 'POST' });
      document.getElementById('tgToken').value = '●'.repeat(10);
      setTgStatus('Token saved.', 'info');
    }

    function setTgStatus(msg, type = 'info') {
      const el = document.getElementById('tgStatus');
      el.textContent = msg;
      el.className = 'tg-status ' + type;
    }

    async function linkTelegram() {
      const username = document.getElementById('tgUsername').value.trim();
      if (!username) { setTgStatus('Enter your username first.', 'unlinked'); return; }
      const btn = document.getElementById('btnLink');
      btn.disabled = true;
      btn.textContent = 'Linking…';
      setTgStatus('Searching for your message…', 'info');
      try {
        const res = await fetch('/api/telegram/link?username=' + encodeURIComponent(username), { method: 'POST' });
        const data = await res.json();
        if (!res.ok) {
          setTgStatus(data.error || 'Link failed.', 'unlinked');
        } else {
          tgLinked = true;
          setTgStatus('✓ Linked — notifications will be sent to ' + username, 'linked');
        }
      } catch (e) {
        setTgStatus('Error: ' + e.message, 'unlinked');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Link';
      }
    }

    // ── Polling ──────────────────────────────────────────────────────
    function currentSlug() { return selectedSlug || clubInput.value.trim(); }

    function checkParams() {
      const p = new URLSearchParams({
        club: currentSlug(),
        date: document.getElementById('date').value,
      });
      const court    = document.getElementById('court').value.trim();
      const from     = document.getElementById('from').value;
      const to       = document.getElementById('to').value;
      const tgUser   = document.getElementById('tgUsername').value.trim();
      const duration = document.getElementById('duration').value;
      if (court)    p.set('court', court);
      if (from)     p.set('from', from);
      if (to)       p.set('to', to);
      if (duration) p.set('duration', duration);
      if (tgUser && tgLinked) p.set('telegramUser', tgUser);
      return p;
    }

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    async function fetchSlots() {
      if (!currentSlug()) { setStatus('Select a club first.', 'error'); return; }
      setStatus('Checking…');
      try {
        const res = await fetch('/api/check?' + checkParams());
        if (!res.ok) throw new Error(await res.text());
        const slots = await res.json();
        renderSlots(slots);
        const ts = new Date().toLocaleTimeString();
        if (slots.length > 0) {
          setStatus(`Last check: ${ts} — ${slots.length} slot(s) found`, 'ok');
          if (Notification.permission === 'granted') {
            new Notification('Court available!', {
              body: `${slots.length} slot(s) open on ${document.getElementById('date').value}`,
            });
          }
        } else {
          setStatus(`Last check: ${ts} — no slots available`);
        }
      } catch (e) {
        setStatus('Error: ' + e.message, 'error');
      }
    }

    function renderSlots(slots) {
      const el = document.getElementById('results');
      if (slots.length === 0) {
        el.innerHTML = '<div class="empty">No available slots found for this date.</div>';
        return;
      }
      el.innerHTML = `
        <div class="section-title" style="max-width:680px;margin:0 auto 12px">
          Available slots <span class="badge">${slots.length}</span>
        </div>
        ${slots.map(s => `
          <div class="slot-card">
            <div class="slot-info">
              <div class="slot-court">${s.court}</div>
              <div class="slot-time">${s.time}</div>
            </div>
            <a class="btn-book" href="${s.bookingUrl}" target="_blank">Book →</a>
          </div>
        `).join('')}
      `;
    }

    function checkOnce() { fetchSlots(); }

    // Add a new parallel poll task
    async function addPoll() {
      if (!currentSlug()) { setStatus('Select a club first.', 'error'); return; }
      Notification.requestPermission();
      const p = checkParams();
      p.set('intervalMinutes', document.getElementById('interval').value);
      const res = await fetch('/api/poll/start?' + p, { method: 'POST' });
      const data = await res.json();
      setStatus(`Poll ${data.id} started.`, 'ok');
      syncPollStatus();
    }

    // Stop a specific poll by ID
    async function stopPoll(id) {
      await fetch('/api/poll/stop?id=' + id, { method: 'POST' });
      syncPollStatus();
    }

    // Stop all polls
    async function stopAllPolls() {
      await fetch('/api/poll/stop', { method: 'POST' });
      syncPollStatus();
    }

    // Render the active polls list from server state
    function renderPolls(tasks) {
      const section = document.getElementById('pollsSection');
      const list    = document.getElementById('pollsList');
      const badge   = document.getElementById('pollCount');

      if (tasks.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      badge.textContent = tasks.length;

      list.innerHTML = tasks.map(t => {
        const meta = [t.date, t.from && t.to ? `${t.from}–${t.to}` : '', `every ${t.intervalMinutes}min`]
          .filter(Boolean).join(' · ');

        let statusText = '';
        let statusClass = '';
        if (t.lastCheck) {
          statusText = t.lastResult === 'no slots'
            ? `${t.lastCheck} — no slots`
            : t.lastResult
              ? `${t.lastCheck} — ${t.lastResult}`
              : t.lastCheck;
          statusClass = t.lastResult && t.lastResult.includes('found') ? 'found'
                      : t.lastResult === 'error' ? 'error' : '';
        } else {
          statusText = 'Waiting for first check…';
        }

        return `
          <div class="poll-card">
            <div class="poll-info">
              <div class="poll-club">${escHtml(t.club)} <span style="color:#4a5068;font-size:0.78rem;font-weight:400">#${t.id}</span></div>
              <div class="poll-meta">${escHtml(meta)}</div>
              <div class="poll-status ${statusClass}">${escHtml(statusText)}</div>
            </div>
            <button class="btn-stop-poll" onclick="stopPoll('${t.id}')">Stop</button>
          </div>`;
      }).join('');
    }

    // Sync polls panel with server state (handles page refresh / multiple tabs)
    async function syncPollStatus() {
      try {
        const res = await fetch('/api/poll/status');
        const tasks = await res.json();
        renderPolls(tasks);
      } catch (_) {}
    }

    setInterval(syncPollStatus, 4000);
    syncPollStatus();

    // ── Logs ─────────────────────────────────────────────────────────
    let lastLogCount = 0;
    let localLogs = [];

    function clearLogs() {
      localLogs = [];
      lastLogCount = 0;
      document.getElementById('logBox').innerHTML = '<span style="color:#4a5068">Log cleared.</span>';
    }

    function classForLine(line) {
      if (line.includes('ERROR')) return 'error';
      if (line.includes('slot(s) found') || line.includes('slot(s) available')) return 'found';
      if (line.includes('Telegram →') || line.includes('Linked') || line.includes('Token')) return 'tg';
      return '';
    }

    async function pollLogs() {
      try {
        const res = await fetch('/api/logs');
        const lines = await res.json();
        if (lines.length !== lastLogCount) {
          lastLogCount = lines.length;
          localLogs = lines;
          const box = document.getElementById('logBox');
          box.innerHTML = lines.map(l =>
            `<div class="log-line ${classForLine(l)}">${escHtml(l)}</div>`
          ).join('');
          box.scrollTop = box.scrollHeight;
        }
      } catch (_) {}
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    setInterval(pollLogs, 2000);
    pollLogs();

    // ── Stop server ───────────────────────────────────────────────────
    async function stopServer() {
      if (!confirm('Stop the server?')) return;
      try {
        await fetch('/api/shutdown', { method: 'POST' });
      } catch (_) {}
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#7c85a2;font-family:-apple-system,sans-serif;">
          <div style="font-size:3rem;margin-bottom:16px">⏹</div>
          <div style="font-size:1.1rem;font-weight:600;color:#e2e8f0">Server stopped</div>
          <div style="margin-top:8px;font-size:0.85rem">You can close this tab.</div>
        </div>`;
    }
  </script>
</body>
</html>
